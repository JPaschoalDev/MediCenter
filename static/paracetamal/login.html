<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <img class="imagem-login" src="./img/Gemini_Generated_Image_uz6lzyuz6lzyuz6l.jfif" alt="Recepção da clínica">

    <div class="caixa">
        <p class="topo">SEJA BEM-VINDO À CLÍNICA PARACETAMAL</p>

        <form id="formLogin">
            <label for="e-mail">E-MAIL</label>
            <input id="e-mail" type="email" required>

            <label for="senha">SENHA</label>
            <div class="campo-senha">
                <input id="senha" type="password" required>
                <button type="button" class="olho" id="toggleSenha" aria-label="Mostrar senha">👁</button>
            </div>

            <p class="erro" id="erro" hidden>E-mail ou senha inválidos.</p>

            <button type="submit" class="entrar">ENTRAR</button>
            <a href="cadastro.html" class="cadastrar">CADASTRAR</a>
        </form>
    </div>

    <script>
        const campo = document.getElementById("senha");
        const botao = document.getElementById("toggleSenha");

        // Mostrar / esconder senha
        botao.addEventListener("click", function () {
            if (campo.type === "password") {
                campo.type = "text";
                botao.textContent = "🙈";
            } else {
                campo.type = "password";
                botao.textContent = "👁";
            }
        });

        // Login: se estiver certo, vai para a página de início
        document.getElementById("formLogin").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("e-mail").value;
            const senha = campo.value;

            // Validação de exemplo: troque pela sua lógica depois
            if (email === "admin@paracetamal.com" && senha === "123") {
                window.location.href = "inicio.html";
            } else {
                document.getElementById("erro").hidden = false;
            }
        });
    </script>
</body>
</html>

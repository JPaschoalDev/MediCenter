<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos</title>
    <link rel="stylesheet" href="./sytle.css">
    
</head>
<body>
    <header class="menu">
        <h1>Paracetamal</h1>
        <nav>
            <a href="inicio.html">Início</a>

            <div class="dropdown">
                <a href="#" class="dropbtn">Cadastros ▾</a>
                <div class="dropdown-conteudo">
                    <a href="paciente.html">Pacientes</a>
                    <a href="medicos.html">Médicos</a>
                    <a href="funcionarios.html">Funcionários</a>
                </div>
            </div>

            <div class="dropdown">
                <a href="#" class="dropbtn">Atendimento ▾</a>
                <div class="dropdown-conteudo">
                    <a href="consultas.html">Consultas</a>
                    <a href="prontuarios.html">Prontuários</a>
                </div>
            </div>

            <a href="painel.html">Painel</a>
            <a href="login.html">Sair</a>
        </nav>
    </header>

    <main class="pagina">
        <h2>Médicos</h2>

        <div id="aviso" class="aviso" hidden></div>

        <form id="form" class="cartao" novalidate>
            <div class="grade">
                <div class="campo">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" maxlength="120">
                    <span class="erro-campo" data-erro="nome"></span>
                </div>
                <div class="campo">
                    <label for="cpf">CPF * (só números)</label>
                    <input type="text" id="cpf" name="cpf" maxlength="14" inputmode="numeric">
                    <span class="erro-campo" data-erro="cpf"></span>
                </div>
                <div class="campo">
                    <label for="crm">CRM *</label>
                    <input type="text" id="crm" name="crm" maxlength="20" placeholder="CRM-SP 123456">
                    <span class="erro-campo" data-erro="crm"></span>
                </div>
                <div class="campo">
                    <label for="especialidade">Especialidade *</label>
                    <input type="text" id="especialidade" name="especialidade" maxlength="80">
                    <span class="erro-campo" data-erro="especialidade"></span>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="15">
                    <span class="erro-campo" data-erro="telefone"></span>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                    <span class="erro-campo" data-erro="email"></span>
                </div>
            </div>

            <div class="botoes-form">
                <button type="submit" id="btnSalvar" class="btn-principal">Cadastrar</button>
                <button type="button" id="btnCancelar" class="btn-secundario" hidden>Cancelar edição</button>
            </div>
        </form>

        <div class="cartao tabela-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>CRM</th>
                        <th>Especialidade</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </main>

    <script src="./crud.js"></script>
    <script>
        iniciarCrud({
            recurso: "medicos",
            nome: "Médico",
            colunas: [
                { chave: "nome" },
                { chave: "cpf" },
                { chave: "crm" },
                { chave: "especialidade" },
                { chave: "telefone" },
                { chave: "email" }
            ]
        });
    </script>
</body>
</html>
